# =============================================================================
# application.properties - Spring Boot配置文件
# =============================================================================
#
# 【文件作用】
# Spring Boot的核心配置文件，配置服务器端口、数据库连接等。
#
# 【设计决策】为什么用properties而不是yaml？
# - properties更简单直观
# - 适合小项目
# - 初学者更容易理解

# =============================================================================
# 服务器配置
# =============================================================================

# 服务端口
# 【设计决策】为什么用8080？
# - 这是Web服务的标准端口
# - 大多数开发者都熟悉
server.port=8080

# =============================================================================
# 数据库配置 - H2内存数据库
# =============================================================================

# 数据库URL
# 【关键点】mem:minidog表示内存模式，数据库名为minidog
# 【注意】应用重启后数据会丢失（内存数据库的特性）
spring.datasource.url=jdbc:h2:mem:minidog;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

# 数据库驱动
spring.datasource.driver-class-name=org.h2.Driver

# 数据库用户名密码（H2默认）
spring.datasource.username=sa
spring.datasource.password=

# =============================================================================
# JPA/Hibernate配置
# =============================================================================

# 自动建表策略
# 【设计决策】为什么用update？
# - create: 每次启动都重建表（数据丢失）
# - update: 只更新结构，保留数据
# - validate: 只验证，不修改
# - none: 什么都不做
spring.jpa.hibernate.ddl-auto=update

# 显示SQL语句（调试用）
# 【提示】生产环境应设为false
spring.jpa.show-sql=true

# SQL格式化（更易读）
spring.jpa.properties.hibernate.format_sql=true

# =============================================================================
# H2控制台配置
# =============================================================================

# 启用H2 Web控制台
# 【作用】可以在浏览器中查看数据库内容
# 【访问地址】http://localhost:8080/h2-console
spring.h2.console.enabled=true

# 控制台访问路径
spring.h2.console.path=/h2-console

# =============================================================================
# 日志配置
# =============================================================================

# 日志级别
logging.level.root=INFO
logging.level.com.minidog=DEBUG

# =============================================================================
# 自定义配置 - 告警相关
# =============================================================================

# 错误率告警阈值（百分比）
# 【设计决策】为什么默认10%？
# - 真实系统错误率通常在1-5%
# - 10%是比较高的阈值，适合演示
# - 可以通过配置调整
alert.error-rate-threshold=10

# 统计时间窗口（分钟）
# 【作用】计算最近N分钟内的错误率
alert.time-window-minutes=5
